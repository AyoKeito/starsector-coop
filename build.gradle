plugins {
    id 'java'
}

import java.time.Instant

group = 'coop'
version = '0.1.0'

def resolveGitCommit = {
    try {
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        return result.exitValue == 0 && value ? value : 'dev-uncommitted'
    } catch (Exception ignored) {
        return 'dev-uncommitted'
    }
}

def coopGitCommit = resolveGitCommit()
def generatedBuildInfoDir = layout.buildDirectory.dir('generated/sources/coopBuildInfo/java')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def starsectorCore = file('../../starsector-core')
def starsectorJars = files(
    "${starsectorCore}/starfarer.api.jar",
    "${starsectorCore}/xstream-1.4.10.jar",
    "${starsectorCore}/log4j-1.2.9.jar",
    "${starsectorCore}/lwjgl_util.jar"
)

dependencies {
    compileOnly starsectorJars
    testImplementation starsectorJars
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.register('generateCoopBuildInfo') {
    inputs.property('version', project.version.toString())
    inputs.property('gitCommit', coopGitCommit)
    outputs.dir(generatedBuildInfoDir)

    doLast {
        def outputFile = generatedBuildInfoDir.get().file('coop/build/CoopBuildInfo.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package coop.build;

public final class CoopBuildInfo {
    public static final String VERSION = "${project.version}";
    public static final String GIT_COMMIT = "${coopGitCommit}";

    private CoopBuildInfo() {
    }
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir generatedBuildInfoDir
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

compileJava.dependsOn tasks.named('generateCoopBuildInfo')

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'coop.jar'
    destinationDirectory = file('jars')
    manifest {
        attributes(
            'Implementation-Title': 'Starsector Coop V1',
            'Implementation-Version': project.version.toString(),
            'Coop-Build-Time': Instant.now().toString(),
            'Coop-Git-Commit': coopGitCommit
        )
    }
}
