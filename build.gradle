plugins {
    id 'java'
}

import java.time.Instant

group = 'coop'
version = '0.1.0'

def nettyVersion = '4.1.69.Final'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def starsectorCore = file('../../starsector-core')
def starsectorJars = files(
    "${starsectorCore}/starfarer.api.jar",
    "${starsectorCore}/xstream-1.4.10.jar",
    "${starsectorCore}/log4j-1.2.9.jar"
)

configurations {
    nettyRuntime
    implementation.extendsFrom(nettyRuntime)
}

dependencies {
    compileOnly starsectorJars
    nettyRuntime "io.netty:netty-buffer:${nettyVersion}"
    nettyRuntime "io.netty:netty-codec:${nettyVersion}"
    nettyRuntime "io.netty:netty-common:${nettyVersion}"
    nettyRuntime "io.netty:netty-handler:${nettyVersion}"
    nettyRuntime "io.netty:netty-resolver:${nettyVersion}"
    nettyRuntime "io.netty:netty-transport:${nettyVersion}"
    testImplementation starsectorJars
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
}

tasks.register('copyNettyJars', Copy) {
    from configurations.nettyRuntime
    into file('jars/netty')
}

jar {
    dependsOn tasks.named('copyNettyJars')
    archiveFileName = 'coop.jar'
    destinationDirectory = file('jars')
    manifest {
        attributes(
            'Implementation-Title': 'Starsector Coop V1',
            'Implementation-Version': project.version.toString(),
            'Coop-Build-Time': Instant.now().toString()
        )
    }
}

build {
    dependsOn tasks.named('copyNettyJars')
}
