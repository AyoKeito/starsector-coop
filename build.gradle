plugins {
    id 'java'
}

import java.time.Instant

group = 'coop'
version = '0.1.0'

def resolveGitCommit = {
    try {
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        if (result.exitValue != 0 || !value) {
            return 'dev-uncommitted'
        }
        // A build from a modified tree is not the commit it sits on. Stamping the bare hash let two
        // machines hold equal Coop-Git-Commit values while their jars differed, which is the one
        // thing the handshake's commit compare exists to catch; the suffix makes it a different
        // string, so a clean build of the same commit no longer matches a dirty one.
        def statusOut = new ByteArrayOutputStream()
        def statusResult = exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = statusOut
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def status = statusOut.toString().trim()
        return statusResult.exitValue == 0 && status ? value + '-dirty' : value
    } catch (Exception ignored) {
        return 'dev-uncommitted'
    }
}

def coopGitCommit = resolveGitCommit()
def generatedBuildInfoDir = layout.buildDirectory.dir('generated/sources/coopBuildInfo/java')
def generatedForksBuildInfoDir = layout.buildDirectory.dir('generated/sources/coopForksBuildInfo/java')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// The install whose starsector-core holds the compile-time jars. The default is the install this
// mod folder sits in, which is where the game itself requires the mod to live; -PstarsectorCore
// (passed by scripts\build.ps1 -BaseInstallRoot) or a STARSECTOR_CORE environment variable point a
// checkout somewhere else at a real install instead of failing with a wall of "cannot find symbol".
def starsectorCoreSetting = project.findProperty('starsectorCore') ?: System.getenv('STARSECTOR_CORE')
def starsectorCore = starsectorCoreSetting ? file(starsectorCoreSetting.toString()) : file('../../starsector-core')
def starsectorJars = files(
    "${starsectorCore}/starfarer.api.jar",
    "${starsectorCore}/xstream-1.4.10.jar",
    "${starsectorCore}/log4j-1.2.9.jar",
    "${starsectorCore}/json.jar",
    // GL11 for coop.ui.CoopBitmapFont: the engine hands a CampaignUIRenderingListener no text-draw
    // call, so the HUD emits its own textured quads (same approach as LazyLib's LazyFont).
    "${starsectorCore}/lwjgl.jar",
    "${starsectorCore}/lwjgl_util.jar"
)

// Forked engine classes need the full set of core jars their original source imports
// (lwjgl + json on top of the base set). compileOnly: the real classes ship in starfarer.api.jar
// at runtime; our fork only overrides them via classpath order.
def forksCompileClasspath = files(
    "${starsectorCore}/starfarer.api.jar",
    "${starsectorCore}/xstream-1.4.10.jar",
    "${starsectorCore}/log4j-1.2.9.jar",
    "${starsectorCore}/lwjgl.jar",
    "${starsectorCore}/lwjgl_util.jar",
    "${starsectorCore}/json.jar"
)

dependencies {
    compileOnly starsectorJars
    testImplementation starsectorJars
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

// FlatLaf (Apache-2.0) for the desktop launcher's UI. Resolved into its own configuration rather
// than launcherImplementation because sourceSets.launcher.compileClasspath below is a plain
// FileCollection assignment, not the auto-wired one Gradle would build from launcherImplementation.
configurations {
    flatlaf
}

dependencies {
    flatlaf 'com.formdev:flatlaf:3.6'
}

tasks.register('generateCoopBuildInfo') {
    inputs.property('version', project.version.toString())
    inputs.property('gitCommit', coopGitCommit)
    outputs.dir(generatedBuildInfoDir)

    doLast {
        def outputFile = generatedBuildInfoDir.get().file('coop/build/CoopBuildInfo.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package coop.build;

public final class CoopBuildInfo {
    public static final String VERSION = "${project.version}";
    public static final String GIT_COMMIT = "${coopGitCommit}";

    private CoopBuildInfo() {
    }
}
"""
    }
}

// The same identity for the OTHER jar. coop-forks.jar is a separate build artifact loaded by a
// separate classloader, and until this existed the handshake reported coop.jar's version on behalf
// of a forks jar nobody had looked at, so two players could pass every version check while running
// different forked engine classes.
//
// Compiled into both source sets and excluded from coop.jar (see the `jar` task), exactly like
// coop.rng and coop.presence: src/main code gets a compile-time type to call, and at runtime the
// single copy on disk lives in coop-forks.jar, so a mismatched or missing forks jar surfaces as the
// LinkageError CoopHandshakeManifest.capture() is written to expect.
tasks.register('generateCoopForksBuildInfo') {
    inputs.property('version', project.version.toString())
    inputs.property('gitCommit', coopGitCommit)
    outputs.dir(generatedForksBuildInfoDir)

    doLast {
        def outputFile = generatedForksBuildInfoDir.get().file('coop/build/CoopForksBuildInfo.java').asFile
        outputFile.parentFile.mkdirs()
        // Methods, not public static final String constants: javac inlines a constant into every
        // caller, so coop.jar would carry its OWN build stamp under this class's name and the
        // mismatch this class exists to report could never be seen. A method call resolves against
        // whatever coop-forks.jar is actually on the classpath.
        outputFile.text = """package coop.build;

/** Build identity of coop-forks.jar. Generated by the build; do not edit. */
public final class CoopForksBuildInfo {

    private static final String VERSION_VALUE = "${project.version}";
    private static final String GIT_COMMIT_VALUE = "${coopGitCommit}";

    private CoopForksBuildInfo() {
    }

    public static String version() {
        return VERSION_VALUE;
    }

    public static String gitCommit() {
        return GIT_COMMIT_VALUE;
    }
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir generatedBuildInfoDir
            srcDir generatedForksBuildInfoDir
        }
    }
    // Forked engine classes (com.fs.starfarer.api.*) plus coop.rng.CoopRandom and
    // coop.presence.CoopPresenceRegistry, which MUST share the same classloader as the forks (the
    // system loader) - so they are built into coop-forks.jar, not coop.jar. See CoopRandom's and
    // CoopPresenceRegistry's classloader contracts.
    forks {
        java {
            srcDirs = ['forks', 'src/main/java/coop/rng', 'src/main/java/coop/presence',
                       generatedForksBuildInfoDir]
        }
        compileClasspath = forksCompileClasspath
    }
    // Phase 31: the desktop launcher (coop.launcher). Ships as jars/coop-launcher.jar and runs in
    // its own JVM started by "Coop Launcher.cmd" - the game is not loaded, so starfarer.api.jar is
    // deliberately absent from this classpath. The launcher reuses CoopPortMapper,
    // CoopConnectionDoctor, CoopOptionsRegistry and CoopNetStartupConfig.validateNewGameSeed out of
    // coop.jar; none of those link to the game API on the paths the launcher touches, and CoopLog
    // falls back to plain log4j when Global is missing. If something here stops compiling without
    // the API jar, the fix is in the launcher, never in this classpath.
    launcher {
        java {
            srcDirs = ['src/launcher/java']
        }
    }
}

sourceSets.launcher.compileClasspath = sourceSets.main.output + files(
    "${starsectorCore}/json.jar",
    "${starsectorCore}/log4j-1.2.9.jar"
) + configurations.flatlaf
sourceSets.launcher.runtimeClasspath = sourceSets.launcher.output + sourceSets.launcher.compileClasspath

dependencies {
    // The launcher tests live in the main test tree (src/test/java/coop/launcher), so the launcher
    // classes have to be visible there. json.jar and log4j are already on the test classpath.
    testImplementation sourceSets.launcher.output
}
// Gradle 8 rejects a Configuration passed as a dependency notation (`testImplementation
// configurations.flatlaf`), so pull flatlaf onto the test classpath by extension instead.
configurations.testImplementation.extendsFrom(configurations.flatlaf)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

compileJava.dependsOn tasks.named('generateCoopBuildInfo')
compileJava.dependsOn tasks.named('generateCoopForksBuildInfo')
tasks.named('compileForksJava').configure {
    dependsOn tasks.named('generateCoopForksBuildInfo')
}

test {
    useJUnitPlatform()
    // Opt-in live spike (CoopPortMapperLiveSpikeTest) that talks to the real router on this LAN.
    // Off by default so ordinary runs never touch network hardware.
    systemProperty 'coop.spike.upnp', System.getProperty('coop.spike.upnp', 'false')
    // XStream 1.4.10 predates the module system and reflects into java.base during its own static
    // init, so a test that exercises the real bundled XStream (CoopGuestSnapshotTest) needs the same
    // opens the game itself passes. These are a subset of starsector-core/vmparams -- the mod adds no
    // access the engine does not already grant at runtime.
    jvmArgs(
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
    )
}

jar {
    archiveFileName = 'coop.jar'
    destinationDirectory = file('jars')
    // coop.rng.CoopRandom and coop.presence.CoopPresenceRegistry live in coop-forks.jar (system
    // classloader). Keep them out of coop.jar (mod classloader) so there is a single canonical copy
    // resolvable by the forked engine classes -- and, for the presence registry, so the copy coop.jar
    // code writes to is the same one the forked RouteManager reads.
    exclude 'coop/rng/**'
    exclude 'coop/presence/**'
    // Same rule for the forks build stamp: the one copy on disk has to be the one inside
    // coop-forks.jar, or it would report this jar's identity instead of that one's.
    exclude 'coop/build/CoopForksBuildInfo*'
    manifest {
        attributes(
            'Implementation-Title': 'Starsector Coop V1',
            'Implementation-Version': project.version.toString(),
            'Coop-Build-Time': Instant.now().toString(),
            'Coop-Git-Commit': coopGitCommit
        )
    }
}

tasks.register('forksJar', Jar) {
    archiveFileName = 'coop-forks.jar'
    destinationDirectory = file('jars')
    from sourceSets.forks.output
    manifest {
        attributes(
            'Implementation-Title': 'Starsector Coop V1 Forks',
            'Implementation-Version': project.version.toString(),
            'Coop-Build-Time': Instant.now().toString(),
            'Coop-Git-Commit': coopGitCommit
        )
    }
}

tasks.register('copyLauncherLibs', Copy) {
    // FlatLaf is a launcher runtime dependency, not shaded into coop-launcher.jar: "Coop
    // Launcher.cmd" puts it on the classpath as jars/flatlaf.jar instead. Renamed off its version
    // number so the .cmd's -cp list never has to change on a FlatLaf bump. Does not touch
    // jars/FLATLAF-LICENSE.txt, which is a committed file this task never writes to.
    from(configurations.flatlaf)
    into file('jars')
    rename { 'flatlaf.jar' }
}

tasks.register('launcherJar', Jar) {
    dependsOn 'copyLauncherLibs'
    archiveFileName = 'coop-launcher.jar'
    destinationDirectory = file('jars')
    // Only the launcher's own classes. coop.jar, json.jar, log4j-1.2.9.jar and flatlaf.jar are put
    // on the classpath by "Coop Launcher.cmd" instead of being shaded in, so there is exactly one
    // copy of every coop class on disk and the launcher can never run against a stale embedded one.
    from sourceSets.launcher.output
    manifest {
        attributes(
            'Implementation-Title': 'Starsector Coop V1 Launcher',
            'Implementation-Version': project.version.toString(),
            'Coop-Build-Time': Instant.now().toString(),
            'Coop-Git-Commit': coopGitCommit,
            'Main-Class': 'coop.launcher.CoopLauncherApp'
        )
    }
}

// Building the mod always produces all three jars.
tasks.named('build').configure {
    dependsOn 'forksJar'
    dependsOn 'launcherJar'
}
